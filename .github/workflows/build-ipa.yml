name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        shell: bash
        run: |
          set +e +o pipefail
          xcodebuild -project SpokenMetronome.xcodeproj -scheme SpokenMetronome \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E -A8 "error:|Could not resolve" build.log | head -40 | while read -r l; do echo "::error::$l"; done
            tail -25 build.log | while read -r l; do echo "::warning::$l"; done
            exit $rc
          fi
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpokenMetronome.app Payload/
          zip -qry SpokenMetronome.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SpokenMetronome-ipa
          path: SpokenMetronome.ipa
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spoken Metronome build ${{ github.run_number }}
          files: SpokenMetronome.ipa
          make_latest: true
