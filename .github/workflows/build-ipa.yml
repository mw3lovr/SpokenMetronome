name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project SpokenMetronome.xcodeproj -scheme SpokenMetronome \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpokenMetronome.app Payload/
          zip -qry SpokenMetronome.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SpokenMetronome-ipa
          path: SpokenMetronome.ipa
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spoken Metronome build ${{ github.run_number }}
          files: SpokenMetronome.ipa
          make_latest: true
