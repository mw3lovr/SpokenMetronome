name: SpokenMetronome
options:
  bundleIdPrefix: com.spokenmetronome
  deploymentTarget:
    iOS: "17.0"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.29.1
targets:
  SpokenMetronome:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Metronome
        NSMicrophoneUsageDescription: Listens to your kick drum to check that every hit lands on the beat.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmetronome.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
